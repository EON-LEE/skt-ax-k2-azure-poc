$schema: https://azuremlschemas.azureedge.net/latest/commandJob.schema.json
type: command
experiment_name: axk2-slo-protocol
display_name: serving-screen-nvfp4-1xND96amsr-A100
description: >-
  Screening of every A100-feasible one-node layout of the official skt/A.X-K2-NVFP4 (SM80 Marlin port) on one
  8xA100-80GB node, one launch each (docs/BENCHMARK_PROTOCOL.md, screening): D (TP8, the parity reference), E
  (TP8 + EP8), Err (E with round-robin experts), D24 (DP2 x TP4 + EP8), D42 (TP4 x PP2) and last D8 (DP8 x TP1
  + EP8 at 1,024 batched tokens per engine; a -1 relaunch is expected) with the protocol's common flags. Each
  launch records start facts, short parity against D, Part R and one Poisson W1 point; a dirty node is
  reclaimed once; every failure is recorded and the job goes on. Results reach the job record after every
  phase (slo.package). Expected about 4.5 h (setup and download 0.3 h, 5 launches of 35-45 min, D8 about
  50 min); timeout 8 h. ROUND 0 keeps the seeds apart from the rounds. The scripts are downloaded from the
  pinned commit of this public repository and checked file by file.
compute: azureml:a100-nd96-lp
environment:
  image: docker.io/vllm/vllm-openai:v0.23.0-cu129
identity:
  type: user_identity
resources:
  instance_count: 1
  shm_size: 256g
distribution:
  type: pytorch
  process_count_per_instance: 1
environment_variables:
  AXK2_SRC_GIT: "__AXK2_SRC_GIT__"
  AXK2_SRC_MANIFEST: "__AXK2_SRC_MANIFEST__"
  FULL_REPO: skt/A.X-K2-NVFP4
  NVFP4_SM80_PORT: "1"
  PHASE_PLAN: "scr-D scr-E scr-Err scr-D24 scr-D42 scr-D8"
  ROUND: "0"
  FULL_HEALTH_TIMEOUT: "1200"
  DOWNLOAD_TIMEOUT: "3600"
  RUN_KERNEL_TESTS: "0"
  TP: "8"
  PP: "1"
command: >-
  mkdir -p /tmp/axk2src && for try in 1 2 3 4 5 6; do python3 -c "import hashlib, os, sys, urllib.request as u;
  repo, sha = os.environ['AXK2_SRC_GIT'].split('@'); items = [i.split(':') for i in os.environ['AXK2_SRC_MANIFEST'].split(',')];
  data = dict((n, u.urlopen('https://raw.githubusercontent.com/' + repo + '/' + sha + '/aml/src/' + n, timeout=120).read()) for n, d in items);
  bad = [n for n, d in items if hashlib.sha256(data[n]).hexdigest() != d]; bad and sys.exit('source digest mismatch: ' + ' '.join(bad));
  [os.makedirs(os.path.dirname('/tmp/axk2src/' + n), exist_ok=True) or open('/tmp/axk2src/' + n, 'wb').write(data[n]) for n, d in items]"
  && break; sleep 20; done && test -f /tmp/axk2src/entry.sh && test -f /tmp/axk2src/bench/protocol.sh &&
  bash /tmp/axk2src/entry.sh none hf:9e2e804e80f8d1b3afba5d7938173cec1ed46b49
limits:
  timeout: 28800
