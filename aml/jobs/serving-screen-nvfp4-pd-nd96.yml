$schema: https://azuremlschemas.azureedge.net/latest/commandJob.schema.json
type: command
experiment_name: axk2-slo-protocol
display_name: serving-screen-nvfp4-pd-2xND96amsr-A100
description: >-
  Rerun of the experimental PD pattern of the official skt/A.X-K2-NVFP4 (SM80 Marlin port) on two 8xA100-80GB
  nodes after the screening's PD start failure (NIXL_ERR_BACKEND, "VRAM memory is detected as host by UCX";
  docs/BENCHMARK_PROTOCOL.md, screening): Dref first (D, TP8, on node0 alone; start facts and short parity only,
  the parity reference), then PD (prefill server on node0, decode server on node1, vLLM NixlConnector). Before PD
  starts, nixl_preflight.py registers VRAM through NIXL on both nodes, with the defaults and with
  UCX_MEMTYPE_CACHE=n; the servers get the first variant that passes on both, and PD is skipped and recorded
  when neither does (UCX_TLS is never set). If UCX still types the KV cache as host memory, both servers
  relaunch once with debug logging, their "Registering descs" lines go to the failure report and the phase
  stops. Otherwise PD runs its smoke request, Part R and the dx2 ladder (0.5-3.0 req/s) under a 90-min client
  limit; its comparisons with Dx1 and Dx2 come from the earlier two-node job (cross-job). Results reach the job
  record after every phase (slo.package). Expected about 2 h (setup and downloads 0.4 h, Dref about 15 min,
  preflight about 5 min, PD 60-70 min); timeout 3 h. ROUND 0 keeps the seeds apart from the rounds. The scripts
  are downloaded from the pinned commit of this public repository and checked file by file.
compute: azureml:a100-nd96-lp
environment:
  image: docker.io/vllm/vllm-openai:v0.23.0-cu129
identity:
  type: user_identity
resources:
  instance_count: 2
  shm_size: 256g
distribution:
  type: pytorch
  process_count_per_instance: 1
environment_variables:
  AXK2_SRC_GIT: "__AXK2_SRC_GIT__"
  AXK2_SRC_MANIFEST: "__AXK2_SRC_MANIFEST__"
  FULL_REPO: skt/A.X-K2-NVFP4
  NVFP4_SM80_PORT: "1"
  PHASE_PLAN: "scr-Dref scr-PD"
  ROUND: "0"
  IB_PROBE: "1"
  FULL_HEALTH_TIMEOUT: "1200"
  DOWNLOAD_TIMEOUT: "5400"
  RUN_KERNEL_TESTS: "0"
  JOIN_TIMEOUT: "5400"
  TP: "8"
  PP: "2"
command: >-
  mkdir -p /tmp/axk2src && for try in 1 2 3 4 5 6; do python3 -c "import hashlib, os, sys, urllib.request as u;
  repo, sha = os.environ['AXK2_SRC_GIT'].split('@'); items = [i.split(':') for i in os.environ['AXK2_SRC_MANIFEST'].split(',')];
  data = dict((n, u.urlopen('https://raw.githubusercontent.com/' + repo + '/' + sha + '/aml/src/' + n, timeout=120).read()) for n, d in items);
  bad = [n for n, d in items if hashlib.sha256(data[n]).hexdigest() != d]; bad and sys.exit('source digest mismatch: ' + ' '.join(bad));
  [os.makedirs(os.path.dirname('/tmp/axk2src/' + n), exist_ok=True) or open('/tmp/axk2src/' + n, 'wb').write(data[n]) for n, d in items]"
  && break; sleep 20; done && test -f /tmp/axk2src/entry.sh && test -f /tmp/axk2src/bench/protocol.sh &&
  bash /tmp/axk2src/entry.sh none hf:9e2e804e80f8d1b3afba5d7938173cec1ed46b49
limits:
  timeout: 10800
