$schema: https://azuremlschemas.azureedge.net/latest/commandJob.schema.json
type: command
experiment_name: axk2-slo-protocol
display_name: slo-round-fp8-2xND96amsr-A100
description: >-
  One round of the pre-registered serving protocol, FP8 round job (docs/BENCHMARK_PROTOCOL.md section 7,
  aml/src/bench/slo_protocol.json rounds.jobs.fp8) on two 8xA100-80GB nodes; set ROUND at submission (1 to 3;
  4 and 5 only when the extension rule fires). PHASE_PLAN slo-round-fp8 runs A (FP8 TP8 x PP2, the reference),
  then B0 (TP16, the pre-registered FP8 choice) and C8m (DP8 x TP2 + EP16, mp-multinode, added after the
  screening) in the round's order, in round 2 C8ms (its sensitivity run), then A2 (A relaunched) and, in round 2,
  cap-A, cap-B0 and cap-C8m. A, B0 and C8m run parity, Part R, closed-loop S1, Poisson W1 and W2 on the frozen
  rate grids with goodput, real-text W1 and last the 32K greedy check (P3); A2 runs parity, Part R, two W1 rates
  and P3. In round 1 A also answers the 1,000-item accuracy subset before P3; in round 3 A, B0 and C8m run a
  45-minute soak (pass SOAK_RATES from bench_stats.py analyze). FP8 only over InfiniBand. The NVFP4 round job
  (slo-round-nvfp4-nd96.yml) may run at the same time on a third node. Results reach the job record after every
  phase (slo.package). Expected about 9.8 h in round 1, 8.2 h in round 2 and 9.7 h in round 3 (estimate); timeout
  12 h. The scripts are downloaded from the pinned commit of this public repository and checked file by file.
compute: azureml:a100-nd96-lp
environment:
  image: docker.io/vllm/vllm-openai:v0.23.0-cu129
identity:
  type: user_identity
resources:
  instance_count: 2
  shm_size: 256g
distribution:
  type: pytorch
  process_count_per_instance: 1
environment_variables:
  AXK2_SRC_GIT: "__AXK2_SRC_GIT__"
  AXK2_SRC_MANIFEST: "__AXK2_SRC_MANIFEST__"
  PHASE_PLAN: "slo-round-fp8"
  ROUND: "1"
  ROUND_LAYOUTS: "B0,C8m"
  IB_PROBE: "1"
  FULL_HEALTH_TIMEOUT: "1800"
  DOWNLOAD_TIMEOUT: "5400"
  RUN_KERNEL_TESTS: "1"
  JOIN_TIMEOUT: "5400"
  TP: "8"
  PP: "2"
command: >-
  mkdir -p /tmp/axk2src && for try in 1 2 3 4 5 6; do python3 -c "import hashlib, os, sys, urllib.request as u;
  repo, sha = os.environ['AXK2_SRC_GIT'].split('@'); items = [i.split(':') for i in os.environ['AXK2_SRC_MANIFEST'].split(',')];
  data = dict((n, u.urlopen('https://raw.githubusercontent.com/' + repo + '/' + sha + '/aml/src/' + n, timeout=120).read()) for n, d in items);
  bad = [n for n, d in items if hashlib.sha256(data[n]).hexdigest() != d]; bad and sys.exit('source digest mismatch: ' + ' '.join(bad));
  [os.makedirs(os.path.dirname('/tmp/axk2src/' + n), exist_ok=True) or open('/tmp/axk2src/' + n, 'wb').write(data[n]) for n, d in items]"
  && break; sleep 20; done && test -f /tmp/axk2src/entry.sh && test -f /tmp/axk2src/bench/protocol.sh &&
  bash /tmp/axk2src/entry.sh none hf:4237c6a60cec6ae449854870d01a42665a1166aa
limits:
  timeout: 43200
